<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="contenedor">
    <h1>Pokédex</h1>

    <p class="introduccion">
      Carga los 151 Pokémon de la primera generación y búscalos por nombre,
      número o parte del nombre. Filtra por tipo, pulsa «Ver detalles»
      para ver sus estadísticas y añade hasta tres a tu equipo.
    </p>

    <form id="formulario-busqueda" class="buscador">
      <label for="busqueda">Nombre o número</label>

      <div class="buscador__controles">
        <input
          id="busqueda"
          name="busqueda"
          type="text"
          placeholder="Ejemplo: pikachu o 25"
          autocomplete="off" 
        >

        <button type="submit">Buscar</button>
      </div>

      <label for="filtro-tipo" class="buscador__etiqueta-tipo">Tipo</label>
      <select id="filtro-tipo" name="tipo">
        <option value="">Todos</option>
      </select>
    </form>

    <button id="boton-cargar" type="button" class="boton-cargar">
      Cargar los 151 Pokémon
    </button>

    <button id="boton-aleatorio" type="button" class="boton-aleatorio">
      Cargar Pokémon aleatorio
    </button>

    <p id="mensaje" class="mensaje" aria-live="polite"></p>

    <section id="resultado" class="resultado"></section>

    <section id="equipo" class="equipo" aria-labelledby="equipo-titulo">
      <h2 id="equipo-titulo">Mi equipo</h2>

      <div id="equipo-lista" class="equipo__lista"></div>

      <p id="equipo-mensaje" class="equipo__mensaje" aria-live="polite"></p>

      <button id="boton-vaciar" type="button" class="equipo__vaciar">
        Vaciar equipo
      </button>
    </section>

    <section id="tarjetas" class="tarjetas" aria-label="Lista de Pokémon"></section>

    <dialog id="detalles" class="detalles" aria-labelledby="detalles-titulo">
      <div id="detalles-contenido" class="detalles__contenido"></div>
    </dialog>
  </main>

  <script src="js/Pokemon.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
